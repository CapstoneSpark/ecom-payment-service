spring.application.name=payment-service
# Server
server.port=8085

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/paymentdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
allowPublicKeyRetrieval=true

order.service.url=http://localhost:8084
product.service.url=http://localhost:8082
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Razorpay config
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}
razorpay.webhookSecret=${RAZORPAY_WEBHOOK_SECRET}

# Payment behavior
payment.defaultCurrency=INR
payment.notifyEventLogging=true

# Logging level (optional)
logging.level.com.example.paymentservice=INFO
